h<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>점심 메뉴 결정 룰렛</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN (축하 폭죽 효과) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Firebase SDKs (Firestore 데이터베이스 연동용) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase 설정 정보 (본인의 Firebase 설정값으로 교체 가능)
    const firebaseConfig = {
      apiKey: "demo-key",
      authDomain: "demo.firebaseapp.com",
      projectId: "demo-project"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function initAuth() {
      try {
        await signInAnonymously(auth);
      } catch (err) {
        console.warn("Firebase Auth fallback:", err);
      }
    }
    initAuth();

    // 당첨 결과를 DB에 자동 기록하는 함수
    window.saveWinnerToDB = async function(menuName, isWin) {
      if (!auth.currentUser) return;
      try {
        const winnersRef = collection(db, 'roulette_winners');
        await addDoc(winnersRef, {
          menu: menuName,
          isWin: isWin,
          timestamp: new Date().toISOString(),
          userId: auth.currentUser.uid
        });
      } catch (e) {
        console.error("Save error:", e);
      }
    };

    // 실시간 당첨 목록 구독 함수 (관리자용)
    window.subscribeWinners = function(callback) {
      if (!auth.currentUser) return;
      const winnersRef = collection(db, 'roulette_winners');
      return onSnapshot(winnersRef, (snapshot) => {
        const list = [];
        snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
        list.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        callback(list);
      }, (err) => {
        console.error("Listen error:", err);
      });
    };
  </script>

  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }
    @keyframes pointer-bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }
    .pointer-anim {
      animation: pointer-bounce 1.2s infinite ease-in-out;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .roulette-shadow {
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.15), 0 0 0 10px #ffffff, 0 0 0 14px #F3F4F6;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-amber-50 via-orange-50 to-amber-100 min-h-screen flex flex-col justify-between items-center p-4 text-gray-800 antialiased relative">

  <!-- 관리자 당첨 현황 버튼 (우측 상단) -->
  <button id="adminToggleBtn" class="absolute top-4 right-4 bg-white/80 backdrop-blur border border-amber-200 text-amber-800 text-xs font-bold px-3 py-1.5 rounded-full shadow-sm hover:bg-white flex items-center gap-1 z-30">
    <span>👑</span> 당첨 현황 (DB)
  </button>

  <!-- 헤더 영역 -->
  <header class="w-full max-w-md text-center pt-4 pb-2">
    <div class="inline-flex items-center gap-2 bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-sm font-semibold mb-2 shadow-sm">
      <span>☕</span> 럭키 룰렛 타임!
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">
      스타벅스 룰렛 이벤트
    </h1>
    <p class="text-sm text-gray-600 mt-1">
      과연 스타벅스 커피의 주인공은?!
    </p>
  </header>

  <!-- 메인 룰렛 영역 -->
  <main class="w-full max-w-md my-auto flex flex-col items-center justify-center relative py-4">
    <!-- 룰렛 컨테이너 -->
    <div class="relative w-[280px] h-[280px] sm:w-[340px] sm:h-[340px] flex items-center justify-center">
      
      <!-- 상단 화살표 -->
      <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-20 pointer-anim filter drop-shadow-md">
        <svg width="40" height="48" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 48L37.3205 18H2.67949L20 48Z" fill="#DC2626"/>
          <circle cx="20" cy="14" r="10" fill="#EF4444" stroke="#B91C1C" stroke-width="3"/>
        </svg>
      </div>

      <!-- 캔버스 (룰렛 판) -->
      <div class="w-full h-full rounded-full roulette-shadow overflow-hidden bg-white">
        <canvas id="rouletteCanvas" class="w-full h-full cursor-pointer"></canvas>
      </div>

      <!-- 중앙 캡 -->
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 sm:w-16 sm:h-16 bg-white rounded-full shadow-lg border-4 border-amber-400 flex items-center justify-center z-10">
        <span class="text-xl sm:text-2xl">🎯</span>
      </div>

    </div>

    <!-- 하단 텍스트 -->
    <div id="quickResult" class="h-10 mt-6 text-center flex items-center justify-center">
      <p class="text-sm sm:text-base font-semibold text-gray-500">
        '점심 메뉴 돌리기' 버튼을 눌러주세요!
      </p>
    </div>
  </main>

  <!-- 하단 컨트롤 버튼 -->
  <footer class="w-full max-w-md pb-6 pt-2 flex flex-col gap-3">
    <button 
      id="spinBtn" 
      class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-xl py-4 rounded-2xl shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 border-b-4 border-orange-700">
      <span>점심 메뉴 돌리기</span>
    </button>

    <button 
      id="resetBtn" 
      class="w-full bg-white hover:bg-gray-50 text-gray-700 font-bold text-lg py-3 rounded-xl border-2 border-gray-200 shadow-sm active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
      <span>다시 돌리기</span>
    </button>
  </footer>

  <!-- 결과 팝업 모달 -->
  <div id="resultModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs sm:max-w-sm rounded-3xl p-6 sm:p-8 text-center shadow-2xl border-4 border-amber-300 animate-pop-in relative">
      
      <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-amber-200 shadow-inner">
        <span id="modalEmoji" class="text-4xl">☕</span>
      </div>

      <p class="text-lg font-bold text-orange-600 mb-1">🎉 룰렛 결과는?</p>
      
      <h2 id="modalMenuName" class="text-2xl sm:text-3xl font-black text-gray-900 my-3 tracking-tight">
        메뉴 이름
      </h2>

      <p id="modalSubText" class="text-xs text-gray-500 mb-4">
        맛있는 시간 보내세요! ✨
      </p>

      <!-- 💬 [카카오톡 당첨 인증하기] 버튼 -->
      <button 
        id="kakaoAuthBtn" 
        class="w-full bg-[#FEE500] hover:bg-[#FADA0A] text-[#191919] font-extrabold text-base py-3 rounded-xl shadow-sm mb-2.5 transition-all flex items-center justify-center gap-2 active:scale-95">
        <svg class="w-5 h-5 fill-current text-[#191919]" viewBox="0 0 24 24">
          <path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.707 4.8 4.27 6.054-.188.702-.682 2.545-.78 2.94-.122.49.178.483.376.352.155-.102 2.469-1.68 3.472-2.366.538.077 1.091.12 1.662.12 4.97 0 9-3.186 9-7.115S16.97 3 12 3z"/>
        </svg>
        <span>카카오톡으로 당첨 인증하기</span>
      </button>

      <button 
        id="modalResetBtn" 
        class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-lg py-3 rounded-xl shadow-md transition-all active:scale-95">
        다시 돌리기
      </button>
    </div>
  </div>

  <!-- 관리자 당첨 현황 모달 -->
  <div id="adminModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full p-6 shadow-2xl flex flex-col justify-between animate-pop-in">
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-4">
          <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2">
            <span>👑</span> 실시간 당첨 현황 (Firebase)
          </h3>
          <button id="closeAdminBtn" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
        </div>
        <p class="text-xs text-gray-500 mb-4">
          룰렛 결과가 데이터베이스에 기록된 내역입니다.
        </p>

        <div id="winnerList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
          <p class="text-xs text-center text-gray-400 py-8">기록을 불러오는 중...</p>
        </div>
      </div>

      <div class="pt-4 border-t border-gray-100">
        <button id="closeAdminBtn2" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl text-sm">
          닫기
        </button>
      </div>
    </div>
  </div>

  <script>
    // 6개 조각 교대 배치
    const menus = [
      { name: "<스타벅스 커피한잔>", color: "#00704A", textColor: "#FFFFFF", emoji: "☕" },
      { name: "<다음기회에>", color: "#E5E7EB", textColor: "#374151", emoji: "😭" },
      { name: "<스타벅스 커피한잔>", color: "#00704A", textColor: "#FFFFFF", emoji: "☕" },
      { name: "<다음기회에>", color: "#E5E7EB", textColor: "#374151", emoji: "😭" },
      { name: "<스타벅스 커피한잔>", color: "#00704A", textColor: "#FFFFFF", emoji: "☕" },
      { name: "<다음기회에>", color: "#E5E7EB", textColor: "#374151", emoji: "😭" }
    ];

    const totalSlices = menus.length;
    const sliceAngle = (2 * Math.PI) / totalSlices;

    const canvas = document.getElementById("rouletteCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const resetBtn = document.getElementById("resetBtn");
    const modalResetBtn = document.getElementById("modalResetBtn");
    const quickResult = document.getElementById("quickResult");
    const resultModal = document.getElementById("resultModal");
    const modalMenuName = document.getElementById("modalMenuName");
    const modalEmoji = document.getElementById("modalEmoji");
    const kakaoAuthBtn = document.getElementById("kakaoAuthBtn");

    let currentAngle = 0;
    let isSpinning = false;
    let animationFrameId = null;

    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      
      drawRoulette();
    }

    function drawRoulette() {
      const width = canvas.getBoundingClientRect().width;
      const height = canvas.getBoundingClientRect().height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = Math.min(centerX, centerY) - 2;

      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < totalSlices; i++) {
        const item = menus[i];
        const startAngle = currentAngle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        const textAngle = startAngle + sliceAngle / 2;
        ctx.rotate(textAngle);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = item.textColor;

        const fontSize = width < 300 ? 11 : 13;
        ctx.font = `800 ${fontSize}px 'Noto Sans KR', sans-serif`;

        ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;

        ctx.fillText(item.name, radius * 0.55, 0);

        ctx.restore();
      }
    }

    function spinRoulette() {
      if (isSpinning) return;

      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.classList.add("opacity-50", "cursor-not-allowed");
      
      quickResult.innerHTML = `<p class="text-base font-bold text-orange-600 animate-pulse">🎯 룰렛을 돌리는 중...</p>`;

      const targetIndex = Math.floor(Math.random() * totalSlices);
      const selectedMenu = menus[targetIndex];

      const targetAngleOffset = -Math.PI / 2 - (targetIndex + 0.5) * sliceAngle;
      const extraRounds = Math.floor(Math.random() * 3) + 5;
      const totalRotationNeeded = (extraRounds * 2 * Math.PI);

      const startAngle = currentAngle;
      const normalizedCurrent = startAngle % (2 * Math.PI);
      
      let finalAngle = startAngle + totalRotationNeeded + (targetAngleOffset - normalizedCurrent);
      
      while (finalAngle - startAngle < totalRotationNeeded) {
        finalAngle += 2 * Math.PI;
      }

      const duration = 4500;
      const startTime = performance.now();

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = easeOutCubic(progress);

        currentAngle = startAngle + (finalAngle - startAngle) * easeProgress;
        drawRoulette();

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          spinBtn.classList.remove("opacity-50", "cursor-not-allowed");
          
          showResult(selectedMenu);
        }
      }

      animationFrameId = requestAnimationFrame(animate);
    }

    function showResult(menu) {
      const isWin = menu.name.includes("스타벅스");
      
      quickResult.innerHTML = `
        <div class="${isWin ? 'bg-emerald-100 border-emerald-300' : 'bg-gray-100 border-gray-300'} border rounded-full px-4 py-1 inline-flex items-center gap-2">
          <span class="text-xs text-gray-600 font-medium">선택됨:</span>
          <span class="text-base font-extrabold text-gray-900">${menu.name} ${menu.emoji}</span>
        </div>
      `;

      modalMenuName.textContent = menu.name;
      modalEmoji.textContent = menu.emoji;

      const modalSubText = document.getElementById("modalSubText");
      if (isWin) {
        modalSubText.innerHTML = `🎉 <b>축하합니다!</b> 카카오톡으로 당첨을 인증해주세요! ☕`;
      } else {
        modalSubText.textContent = `아쉽네요! 다음에 다시 도전해보세요 😭`;
      }

      resultModal.classList.remove("hidden");

      if (typeof window.saveWinnerToDB === 'function') {
        window.saveWinnerToDB(menu.name, isWin);
      }

      if (isWin && typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }

    function closeModal() {
      resultModal.classList.add("hidden");
    }

    function resetRoulette() {
      if (isSpinning) return;
      closeModal();
      quickResult.innerHTML = `<p class="text-sm sm:text-base font-semibold text-gray-500">'점심 메뉴 돌리기' 버튼을 눌러주세요!</p>`;
    }

    // 카카오톡 버튼 클릭 로직
    kakaoAuthBtn.addEventListener("click", () => {
      // 본인 오픈채팅방 주소로 변경 가능
      const myKakaoLink = "https://open.kakao.com/o/sq99UnYi"; 

      if (myKakaoLink === "https://open.kakao.com") {
        alert("카카오톡 오픈채팅방 링크가 아직 설정되지 않았습니다.\n코드 내의 myKakaoLink 주소를 변경해 주세요!");
        return;
      }
      
      window.open(myKakaoLink, "_blank");
    });

    // 관리자 페이지 토글
    const adminToggleBtn = document.getElementById("adminToggleBtn");
    const adminModal = document.getElementById("adminModal");
    const closeAdminBtn = document.getElementById("closeAdminBtn");
    const closeAdminBtn2 = document.getElementById("closeAdminBtn2");
    const winnerList = document.getElementById("winnerList");
    let unsubscribeDB = null;

    adminToggleBtn.addEventListener("click", () => {
      adminModal.classList.remove("hidden");
      if (typeof window.subscribeWinners === 'function') {
        unsubscribeDB = window.subscribeWinners((list) => {
          if (!list || list.length === 0) {
            winnerList.innerHTML = `<p class="text-xs text-center text-gray-400 py-8">아직 참여 기록이 없습니다.</p>`;
            return;
          }
          winnerList.innerHTML = list.map(item => {
            const date = new Date(item.timestamp).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return `
              <div class="flex items-center justify-between p-3 rounded-xl ${item.isWin ? 'bg-emerald-50 border border-emerald-200' : 'bg-gray-50 border border-gray-200'} text-xs">
                <div>
                  <span class="font-extrabold ${item.isWin ? 'text-emerald-700' : 'text-gray-600'}">${item.menu}</span>
                  <span class="text-[10px] text-gray-400 block mt-0.5">ID: ${item.userId ? item.userId.substring(0,8) : '익명'}</span>
                </div>
                <span class="text-gray-400 font-mono text-[11px]">${date}</span>
              </div>
            `;
          }).join('');
        });
      }
    });

    function closeAdmin() {
      adminModal.classList.add("hidden");
      if (unsubscribeDB) {
        unsubscribeDB();
        unsubscribeDB = null;
      }
    }

    closeAdminBtn.addEventListener("click", closeAdmin);
    closeAdminBtn2.addEventListener("click", closeAdmin);

    spinBtn.addEventListener("click", spinRoulette);
    resetBtn.addEventListener("click", resetRoulette);
    modalResetBtn.addEventListener("click", resetRoulette);

    resultModal.addEventListener("click", (e) => {
      if (e.target === resultModal) {
        closeModal();
      }
    });

    window.addEventListener("resize", setupCanvas);

    window.onload = () => {
      setupCanvas();
    };
  </script>
</body>
</html>
